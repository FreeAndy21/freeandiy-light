min = 1

[[replace]]
name = "installer test registry key"
include = ["packaging/**"]
find = "LightCraftInstallerTests"
replace = "FreeANDIYLightInstallerTests"
min = 1

[[replace]]
name = "product name LightCraft (Rust code, not comments; whole word)"
include = ["**/*.rs"]
exclude = ["xtask/**"]
regex = '\bLightCraft\b'
replace = "{{this.name}}"
skip_comments = ["//"]
min = 150

[[replace]]
name = "product name LightCraft (catalogs: any script may follow it)"
include = ["crates/ui-egui/locales/*.json"]
find = "LightCraft"
replace = "{{this.name}}"
min = 50

[[replace]]
name = "product name LightCraft (packaging, web page, CI)"
