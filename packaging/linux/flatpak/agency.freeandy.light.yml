# Flatpak manifest for FreeANDIY Light, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/agency.freeandy.light.yml
#   flatpak run agency.freeandy.light
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
#
# agency.freeandy.light.bundle.yml (same directory) builds the .flatpak attached to every
# release from the prebuilt binaries. Keep runtime-version and finish-args identical in both
# (packaging-lint checks this).
id: agency.freeandy.light
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: freeandiy-light
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # The library lives in ~/Pictures/FreeANDIY Light Library by default, and imports usually come from
  # Pictures. Open/Save dialogs go through the file-chooser portal (rfd's xdg-portal backend) and
  # drag-and-drop through the document portal, so picked folders elsewhere work without broad
  # filesystem access.
  - --filesystem=xdg-pictures
  # Deliberately not granted: home/host filesystem access, and network. The network is only for
  # the optional SAM 3 model download (AI Object/Describe masks, docs/ai-masks.md); without it
  # that download fails with an error and everything else works. Users who want it run
  # `flatpak override --user --share=network agency.freeandy.light`.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: freeandiy-light
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/freeandiy-light/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p lightcraft -p lightcraft-cli
      - install -Dm755 target/release/freeandiy-light /app/bin/freeandiy-light
      - install -Dm755 target/release/freeandiy-light-cli /app/bin/freeandiy-light-cli
      - install -Dm644 packaging/linux/agency.freeandy.light.desktop /app/share/applications/agency.freeandy.light.desktop
      - install -Dm644 packaging/linux/agency.freeandy.light.mime.xml /app/share/mime/packages/agency.freeandy.light.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/agency.freeandy.light.metainfo.xml.in > /app/share/metainfo/agency.freeandy.light.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
