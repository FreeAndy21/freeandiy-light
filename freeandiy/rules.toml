# FreeANDIY rebrand rules for this repository (applied by freeandiy/tools/rebrand, after the
# patches in freeandiy/patches/). Modified-by: FreeANDIY (Free Andy Agency), 2026.
#
# Double-brace placeholders (e.g. this.name) come from branding.toml and app.toml (`rebrand vars`
# lists them). Every rule has a minimum match count: when upstream renames or moves something, the
# rule fails loudly instead of silently leaving the old brand in place.
#
# Protected text: rules first swap text that must keep the upstream name (cargo package names,
# the .lightcraft document format, file names we keep) for @@...@@ markers, and the last rules
# swap them back.

# Copied files whose placeholders are filled in at the end.
templates = [
  "crates/ui-egui/src/freeandiy.rs",
  "crates/ui-egui/locales/sk.json",
]

delete = [
  "docs/brand",                                  # ArtCraft marks: forks must remove them
  "assets/app-icon",                             # upstream's identity; ours is copied in below
  ".github/workflows/release.yml",               # upstream's release and platform jobs; ours: freeandiy*.yml
  ".github/workflows/windows-arm64.yml",
  ".github/workflows/packaging-lint.yml",
  ".github/workflows/freebsd.yml",
  "nix",                                         # upstream's Nix packaging (FreeANDIY doesn't ship one)
  "flake.nix",
  "flake.lock",
  "packaging/icons.sh",                          # icons come from the FreeANDIY meta repository
  "packaging/macos/dmg",                         # background and layout derived from upstream's icon; ours is copied in
]

# Translation catalogs (JSON, one message per line): drop the Discord entries (the strings are
# gone from the UI); other ArtCraft mentions become FreeANDIY below.
[[drop_lines]]
include = ["crates/ui-egui/locales/*.json"]
regex = '^\s*"[^"\n]*Discord'
min = 10

# ---------------------------------------------------------------------------------------------
# Identifiers, maintainers, URLs.

[[replace]]
name = "app id"
include = ["**"]
exclude = ["**/*.md", "docs/**", "NOTICE", "assets/ATTRIBUTION.md"]
find = "ai.storyteller.lightcraft"
replace = "{{this.app_id}}"
min = 15

[[replace]]
name = "Edit in: FreeANDIY Photo's app id (instead of PhotoCraft's)"
include = ["apps/lightcraft/src/editors.rs"]
find = "ai.storyteller.photocraft"
replace = "{{brand.id_prefix}}.photo"
min = 1

[[replace]]
name = "Edit in: FreeANDIY Photo's page"
include = ["apps/lightcraft/src/editors.rs"]
find = "getartcraft.com/apps/photocraft"
replace = "{{brand.website}}/photo"
min = 1

[[replace]]
name = "Edit in: FreeANDIY Photo's executable"
include = ["apps/lightcraft/src/editors.rs"]
regex = '\bphotocraft(\.exe)?\b'
replace = "freeandiy-photo${1}"
skip_comments = ["//"]
min = 4

[[replace]]
name = "Edit in: FreeANDIY Photo's name (code, tests and catalogs)"
include = ["**/*.rs", "crates/ui-egui/locales/*.json"]
exclude = ["xtask/**"]
find = "PhotoCraft"
replace = "FreeANDIY Photo"
skip_comments = ["//"]
min = 20

[[replace]]
name = "developer id"
include = ["packaging/**"]
find = "ai.storyteller"
replace = "{{brand.id_prefix}}"
min = 0

[[replace]]
name = "package maintainer"
include = ["packaging/**"]
find = "LightCraft maintainers <lightcraft@storyteller.ai>"
replace = "{{brand.maintainer}}"
min = 1

[[replace]]
name = "links: this app's page"
include = ["crates/ui-egui/src/links.rs"]
find = "https://getartcraft.com/apps/lightcraft"
replace = "{{this.page}}"
min = 1

[[replace]]
name = "links: website"
include = ["crates/ui-egui/src/links.rs"]
find = "https://getartcraft.com"
replace = "{{brand.website}}"
min = 1

[[replace]]
name = "links: repository, docs, feedback"
include = ["crates/ui-egui/src/links.rs"]
find = "https://github.com/storytold/lightcraft"
replace = "{{this.github}}"
min = 3

[[replace]]
name = "website labels (code and catalogs)"
include = ["**/*.rs", "crates/ui-egui/locales/*.json"]
regex = 'ArtCraft( — more creative apps| Website)'
replace = "{{brand.name}}${1}"
min = 3

[[replace]]
name = "catalogs: other ArtCraft mentions"
include = ["crates/ui-egui/locales/*.json"]
find = "ArtCraft"
replace = "{{brand.name}}"
min = 0

[[replace]]
name = "upstream issues URL"
include = ["packaging/**", ".github/**"]
find = "https://github.com/storytold/lightcraft/issues"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "upstream repository URL"
include = ["packaging/**", ".github/**"]
regex = 'https://github\.com/storytold/lightcraft(/|"|<|\x27|$)'
replace = "{{this.github}}${1}"
min = 1

[[replace]]
name = "upstream repo slug (raw URLs, GITHUB_REPOSITORY defaults)"
include = ["packaging/**", ".github/**"]
regex = 'storytold/lightcraft\b'
replace = "{{brand.github_owner}}/{{this.repo}}"
min = 1

[[replace]]
name = "upstream product page"
include = ["packaging/**", ".github/**"]
find = "https://getartcraft.com/apps/lightcraft"
replace = "{{this.page}}"
min = 1

[[replace]]
name = "upstream Discord (packaging contact/help links)"
include = ["packaging/**"]
find = "https://discord.gg/artcraft"
replace = "{{this.issues}}"
min = 0

[[replace]]
name = "settings dir (Linux)"
include = ["crates/engine/src/config.rs"]
find = 'c.join("lightcraft")'
replace = 'c.join("{{this.repo}}")'
min = 1

[[replace]]
name = "portable data folder"
include = ["**/*.rs", "packaging/**"]
find = "LightCraftData"
