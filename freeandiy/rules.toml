replace = "{{this.name}}"
min = 1

[[replace]]
name = "config test: the Linux settings folder is freeandiy-light, like the code"
include = ["crates/engine/src/config.rs"]
find = '/lightcraft")'
replace = '/freeandiy-light")'
min = 2

[[replace]]
name = "restore the legacy DNG Software tag"
include = ["crates/raw/src/dng.rs", "crates/raw/tests/dng.rs"]
find = "@@LCLEGACY@@"
replace = "LightCraft"
min = 2

# ---------------------------------------------------------------------------------------------
# Upstream's "every language translates everything" checks, with the partial Slovak catalog
# FreeANDIY adds (menus, commands, common dialogs and the core photo terms; the rest falls back to
# English).

[[replace]]
name = "i18n tests: every complete language (not the partial Slovak one)"
include = ["crates/ui-egui/src/i18n.rs"]
regex = '\.filter\(\|(language|l)\| \*\*(language|l) != Locale::En\)'
replace = '.filter(|${1}| !matches!(**${2}, Locale::En | Locale::Sk))'
min = 3

[[replace]]
name = "keyword list test: FreeANDIY adds Slovak (partial, so not in the list of complete files)"
include = ["crates/ui-egui/src/panels/keyword_list.rs"]
find = 'assert_eq!(Locale::ALL.len(), 10, "a language added: list its file above");'
replace = 'assert_eq!(Locale::ALL.len(), 11, "a language added: list its file above (FreeANDIY: Slovak is partial)");'
min = 1

[[replace]]
name = "Settings: the language is a menu (eleven languages don't fit in a row of buttons)"
include = ["crates/ui-egui/src/panels/settings.rs"]
find = '''        choices(ui, "settingsLanguage", &languages, &mut app.ui.language);'''
replace = '''        // FreeANDIY: with Slovak, eleven languages no longer fit in a row of buttons; a menu holds any number.
        egui::ComboBox::from_id_salt("settingsLanguage").selected_text(app.ui.language.name()).show_ui(ui, |ui| {
            for (language, name) in &languages {
                ui.selectable_value(&mut app.ui.language, *language, *name);
            }
        });'''
min = 1

[[replace]]
name = "i18n tests: choice labels in every complete language (not the partial Slovak one)"
include = ["crates/ui-egui/src/i18n.rs"]
find = "                    if *language != Locale::En {"
replace = "                    if !matches!(*language, Locale::En | Locale::Sk) {"
min = 1

[[replace]]
name = "restore the protected feature names and image path"
include = ["packaging/**"]
find = "@@KEEPL@@"
replace = "lightcraft"
min = 5

# ---------------------------------------------------------------------------------------------
# Shared by every FreeANDIY app (FreeAndy21/freeandiy, common/rules-msi-notices.toml):
# the Windows MSI installs the licences, NOTICE, the attribution, the font licences and the brand
# terms next to the app, like the portable ZIP and the other packages (Apache-2.0 4(d)).

[[replace]]
name = "Windows MSI: stage the notices before wix build"
include = ["packaging/windows/package.ps1"]
regex = '''(?m)^(\$Msi = Join-Path \$Dist )'''
replace = '''# FreeANDIY: the MSI installs these next to the app (Apache-2.0 4(d); same set as the portable ZIP).
$$FaNotices = Join-Path $$Stage 'freeandiy-notices'
Remove-Item -Recurse -Force $$FaNotices -ErrorAction SilentlyContinue
New-Item -ItemType Directory -Force -Path $$FaNotices | Out-Null
foreach ($$f in 'LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md', 'ASSETS.md') {
  $$p = Join-Path $$Root $$f
  if (Test-Path $$p) { Copy-Item $$p $$FaNotices }
}
Copy-Item (Join-Path $$Root 'freeandiy\assets\fonts\OFL-*.txt') $$FaNotices
Copy-Item (Join-Path $$Root 'freeandiy\assets\brand\LICENSE-brand.txt') (Join-Path $$FaNotices 'LICENSE-FreeANDIY-brand.txt')
if ($$env:CRAFT_FONTS_DIR) {
  Get-ChildItem -Path (Join-Path $$env:CRAFT_FONTS_DIR 'fonts') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
    $$lic = Join-Path $$_.FullName 'OFL.txt'
    if (Test-Path $$lic) { Copy-Item $$lic (Join-Path $$FaNotices "OFL-$$($$_.Name).txt") }
  }
}
foreach ($$f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE', 'ATTRIBUTION.md') {
  if (-not (Test-Path (Join-Path $$FaNotices $$f))) { throw "MSI notices: $$f is missing" }
}

${1}'''

[[replace]]
name = "Windows MSI: pass the notices folder to wix build"
include = ["packaging/windows/package.ps1"]
regex = '''(wix build [^\n]*?-arch \$Arch)'''
replace = '''${1} -d "NoticesDir=$$FaNotices"'''

[[replace]]
name = "Windows MSI: install the notices (feature)"
include = ["packaging/windows/*.wxs"]
regex = '''(?m)^(\s*)(<ComponentGroupRef Id="[A-Za-z]+Files" />)'''
replace = '''${1}${2}
${1}<ComponentGroupRef Id="FreeandiyNotices" />'''

[[replace]]
name = "Windows MSI: install the notices (files)"
include = ["packaging/windows/*.wxs"]
exclude = ["packaging/windows/installer-ui.wxs"]
regex = '''(?m)^</Wix>'''
replace = '''  <!-- FreeANDIY: licences, NOTICE, attribution, font licences and brand terms (Apache-2.0 4(d)),
       staged by package.ps1. -->
  <Fragment>
    <ComponentGroup Id="FreeandiyNotices" Directory="INSTALLFOLDER">
      <Files Include="$$(var.NoticesDir)\*" />
    </ComponentGroup>
  </Fragment>
</Wix>'''
