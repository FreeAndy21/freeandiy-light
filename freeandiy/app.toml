# This repository's FreeANDIY settings (branding.toml is shared by all FreeANDIY repositories).
# Modified-by: FreeANDIY (Free Andy Agency), 2026. New file, not part of upstream LightCraft.

app = "light" # which [apps.<id>] entry of branding.toml this repository builds

[build]
# cargo arguments for the release binaries, the tests sync-upstream.sh runs, and the web page.
bins = "-p lightcraft -p lightcraft-cli"
features = ""
tests = "-p lightcraft-ui-egui -p lightcraft-engine -p lightcraft -p lightcraft-cli"
web_index = "apps/lightcraft-web/index.html"
# Environment for tests: English UI whatever the machine's locale.
test_env = "LIGHTCRAFT_LANGUAGE=en"
web_env = ""
# Upstream has no test workflow of its own: freeandiy.yml runs build.tests on Linux.
ci_tests = "true"

[check]
# check-branding.sh: extra allowed strings (regex) and Rust paths where the upstream name may stay
# in string literals (git pathspecs, space-separated).
# Also: upstream's legacy DNGs are recognised by their "LightCraft" Software tag.
allow = "Some\\(\"LightCraft\"\\)|SOFTWARE, \"LightCraft\""
rs_exclude = ":!xtask/**"
