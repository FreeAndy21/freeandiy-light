min = 2

# ---------------------------------------------------------------------------------------------
# Protect text that keeps the upstream name.

[[replace]]
name = "protect: attribution 'the LightCraft authors'"
include = ["apps/*/build.rs", "packaging/**"]
find = "the LightCraft authors"
replace = "{{brand.owner}} and the @@UPSTREAM@@ authors"
min = 0

[[replace]]
name = "web release zip: freeandiy-light-<version>-web-wasm32.zip (before the crate-name protect)"
include = ["packaging/web/package.sh", "packaging/web/README.md", "docs/releasing.md"]
regex = 'lightcraft-web-(<version>|<v>|\$VERSION)'
replace = "{{this.repo}}-${1}-web-wasm32"
min = 1

[[replace]]
name = "protect: cargo -p / --package lightcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(-p|--package) lightcraft'
replace = '$1 @@PKG@@'
min = 2

[[replace]]
name = "protect: crate names lightcraft-<crate>"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'lightcraft-(catalog|codecs|color|denoise|denoise-core|develop|engine|faces|fetch|geocode|geom|gpu|heif|inpaint|lensdb|mcp|merge|meta|pipeline|preview|raster|raw|scenes|segment|sysmem|tiff|ui-egui|web)\b'
replace = '@@PKG@@-$1'
min = 0

[[replace]]
name = "protect: cargo features lightcraft/<feature>"
include = ["packaging/**", ".github/**"]
find = "'lightcraft/"
replace = "'@@PKG@@/"
min = 0

[[replace]]
name = "protect: source paths apps/lightcraft"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = '(apps[/\\])lightcraft'
replace = '${1}@@PKG@@'
min = 0

[[replace]]
name = "protect: crate idents lightcraft_"
include = ["packaging/**", ".github/**", "Dockerfile"]
find = "lightcraft_"
replace = "@@PKG@@_"
min = 0

[[replace]]
name = "protect: WiX sources lightcraft.wxs"
include = ["packaging/**", ".github/**", "Dockerfile"]
regex = 'lightcraft(\.wxs|\.en-us\.wxl)'
replace = '@@PKG@@${1}'
min = 1

# ---------------------------------------------------------------------------------------------
# The product name in the UI, messages, translations, packaging and the web page.

[[replace]]
name = "Info.plist custom keys: LightCraftVersion"
